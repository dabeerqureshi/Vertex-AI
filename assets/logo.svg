<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 172" role="img" aria-label="Volo AI logo">
  <defs>
    <linearGradient id="volograd" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#8b5cf6"/>
      <stop offset="0.45" stop-color="#6366f1"/>
      <stop offset="0.75" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="voloradial" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- mark: a "V" with an echo / voice-wave, like wings in motion -->
  <g>
    <path d="M44 150 C 58 128 74 108 92 88 S 120 60 150 44" fill="none" stroke="url(#volograd)" stroke-width="26" stroke-linecap="round"/>
    <path d="M196 150 C 182 128 166 108 148 88 S 120 60 90 44" fill="none" stroke="url(#volograd)" stroke-width="26" stroke-linecap="round"/>
    <path d="M60 150 C 70 136 80 120 92 102 S 112 80 132 60" fill="none" stroke="url(#voloradial)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <path d="M180 150 C 170 136 160 120 148 102 S 128 80 108 60" fill="none" stroke="url(#voloradial)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <circle cx="150" cy="44" r="7" fill="#22d3ee"/>
    <circle cx="222" cy="34" r="4.4" fill="#f472b6"/>
    <circle cx="250" cy="58" r="3" fill="#8b5cf6"/>
  </g>

  <text x="278" y="103" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="#f8f7fc" letter-spacing="0.5">Volo</text>
  <rect x="388" y="62" width="60" height="42" rx="11" fill="none" stroke="url(#volograd)" stroke-width="4"/>
  <text x="421" y="91" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="800" fill="url(#volograd)" text-anchor="middle" letter-spacing="1">AI</text>
</svg>